---
- name: Installing containerd
  import_tasks: install_containerd.yaml

- name: Check and register cluster_name in DNS
  import_tasks: check_dns.yaml
  when: "'masters' in group_names"

- name: Delete cluster_name from DNS
  import_tasks: delete_dns.yaml
  tags:
    - destroy

- name: Remove MetalLB netplan route
  import_tasks: delete_metallb_route.yaml
  tags:
    - destroy

- name: Installing pre-req packages
  import_tasks: install_k8s_prereqs.yaml

- name: Add k8s apt repo
  import_tasks: add_k8s_repo.yaml

- name: Install main k8s packages
  import_tasks: base_k8s_install.yaml

- name: Install controlplane
  import_tasks: deploy_controlplane.yaml
  when: "'masters' in group_names"

- name: Create kubeconfig
  import_tasks: create_kube_config.yaml
  when: "'masters' in group_names"

- name: Install WeaveWorks network
  import_tasks: install_k8s_network.yaml
  when: "'masters' in group_names"

- name: Register join command
  import_tasks: register_joincmd.yaml
  when: '"masters" in group_names'

- name: Register worker nodes
  import_tasks: register_workers.yaml
  when: "'workers' in group_names"

- name: Install nfs_common
  import_tasks: install_nfs_common.yaml

- name: Deploy helm binary
  import_tasks: install_helm.yaml
  when: '"masters" in group_names'

- name: Deploy cert-manager
  import_tasks: install_cert_manager.yaml
  when: '"masters" in group_names'

- name: Create cert-manager cluster CA secret
  import_tasks: create_cluster_ca_pair.yaml
  when: '"masters" in group_names'

- name: Create cert-manager cluster CA issuer
  import_tasks: create_cluster_ca_issuer.yaml
  when: '"masters" in group_names'

- name: Create Omega ADCS CA ConfigMap
  import_tasks: create_omegaca_cm.yaml
  when: '"masters" in group_names'

- name: Apply Omega CA trust-manager Bundle
  import_tasks: apply_omega_bundle.yaml
  when: '"masters" in group_names'

- name: Install CA bundle injector
  import_tasks: install_bundle_injector.yaml
  when: '"masters" in group_names'
  
- name: Install SPIRE registrar
  import_tasks: install_spire_registrar.yaml
  when: '"masters" in group_names'

- name: Install SPIRE agent
  import_tasks: install_spire_agent.yaml
  when: '"masters" in group_names'

- name: Install SPIFFE CSI driver
  import_tasks: install_spiffe_csi_driver.yaml
  when: '"masters" in group_names'

- name: Install SPIFFE CSI injector
  import_tasks: install_spiffe_csi_injector.yaml
  when: '"masters" in group_names'

- name: Deploy nfs storage_class
  import_tasks: install_nfs_sc.yaml
  when: '"masters" in group_names'

- name: Deploy stern binary
  import_tasks: install_stern.yaml
  when: '"masters" in group_names'

- name: Deploy metal-lb load balancer
  import_tasks: install_metallb.yaml
  when: '"masters" in group_names'
